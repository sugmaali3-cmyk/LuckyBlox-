<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuckyBlox</title>
<style>
  :root{--bg:#060b12;--p1:rgba(255,255,255,.04);--p2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--txt:#eef6f1;--dim:#8fa8a0;--acc:#ffb703;--g1:#22c55e;--g2:#10b981;--g3:#86efac;--ok:#4ade80;--bad:#ff4d6d}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:
      radial-gradient(900px 520px at 8% -5%,rgba(16,185,129,.22),transparent 60%),
      radial-gradient(800px 520px at 100% 8%,rgba(99,102,241,.14),transparent 60%),
      radial-gradient(700px 500px at 50% 110%,rgba(255,183,3,.07),transparent 60%),
      var(--bg);
    background-attachment:fixed;color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
  #bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
  #fx{position:fixed;inset:0;z-index:70;pointer-events:none}
  button{font-family:inherit}
  .ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
  .ico.f{fill:currentColor;stroke:none}
  .coin{width:1.05em;height:1.05em;vertical-align:-.17em;margin-right:.28em;flex:none}
  .cn{white-space:nowrap}

  /* layout */
  .app{display:grid;grid-template-columns:286px 1fr;min-height:100vh}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px 14px;background:linear-gradient(180deg,#06281c,#041a13 55%,#030f0b);border-right:1px solid rgba(34,197,94,.25);box-shadow:8px 0 40px -20px rgba(16,185,129,.35)}
  .side::-webkit-scrollbar{width:0}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:25px;letter-spacing:3px;padding:2px 0}
  .brand span{background:linear-gradient(90deg,#86efac,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lg{width:38px;height:38px;filter:drop-shadow(0 0 10px rgba(34,197,94,.6))}
  .me{padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(255,255,255,.03));border:1px solid rgba(34,197,94,.35);cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .me:hover{border-color:var(--g1);box-shadow:0 0 22px -8px var(--g1)}
  .mer{display:flex;align-items:center;gap:10px}
  .meav,.av,.pav,.lav{background:linear-gradient(145deg,var(--a,#0b1024),var(--b,#04150f));display:grid;place-items:center;overflow:hidden}
  .avg{width:58%;height:58%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .meav{width:46px;height:46px;border-radius:50%;border:2px solid var(--g1);flex:none;box-shadow:0 0 16px -4px var(--g1)}
  .meinfo{min-width:0;flex:1}
  .meinfo b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meinfo small{color:var(--g3);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
  .merank{font-weight:900;color:var(--acc);font-size:19px}
  .xp{height:8px;border-radius:5px;background:rgba(0,0,0,.45);margin-top:10px;overflow:hidden;border:1px solid rgba(34,197,94,.2)}
  .xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#4ade80,#bbf7d0);border-radius:5px;transition:width .5s}
  .xpt{font-size:11px;color:var(--dim);margin-top:5px}
  .navs{display:flex;flex-direction:column;gap:5px}
  .ngrp{font-size:10px;letter-spacing:2.5px;color:#5e8a78;font-weight:800;padding:8px 10px 2px;text-transform:uppercase}
  .nv{position:relative;display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:6px;align-items:center;padding:8px 10px;border-radius:14px;border:1px solid transparent;background:none;color:#a7c4b9;font-weight:700;font-size:14px;cursor:pointer;text-align:left;transition:background .15s,color .15s,border-color .15s,transform .12s}
  .nv .ni{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);color:var(--g3);transition:background .2s,color .2s,box-shadow .2s}
  .nv .ni .ico{width:21px;height:21px}
  .nl{display:flex;justify-content:space-between;align-items:center;min-width:0;align-self:end}
  .nt{font-size:11px;font-weight:800;color:var(--g3);background:rgba(34,197,94,.14);padding:1px 8px;border-radius:10px}
  .nbar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;align-self:start}
  .nbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#15803d,#22c55e,#86efac);transition:width .5s}
  .nv:hover{background:rgba(34,197,94,.09);color:#fff;transform:translateX(3px)}
  .nv:hover .ni{background:rgba(34,197,94,.2)}
  .nv.on{background:linear-gradient(90deg,rgba(34,197,94,.30),rgba(34,197,94,.04));border-color:rgba(34,197,94,.55);color:#fff}
  .nv.on .ni{background:linear-gradient(145deg,#34d36b,#0f9d58);color:#03210f;border-color:#bbf7d0;box-shadow:0 0 20px -2px var(--g1)}
  .nv.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--g1);box-shadow:0 0 12px var(--g1)}
  .nv.on .nbar i{box-shadow:0 0 10px var(--g1)}
  .sidefoot{margin-top:auto;display:grid;gap:8px}
  .sf{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2)}
  .sf .sfi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.35);color:var(--dim);flex:none}
  .sf b{display:block;font-size:13px}
  .sf small{font-size:11px;color:var(--dim)}
  .sf.run .sfi{color:var(--g3);box-shadow:0 0 14px -3px var(--g1)}
  .sf.run .sfi .ico{animation:spin 3s linear infinite}
  .sf.boost.run .sfi{color:#ffe48f;box-shadow:0 0 14px -3px var(--acc)}
  .sf.boost.run .sfi .ico{animation:none}
  .sf .sfb{flex:1;min-width:0}
  .sf .ab{height:5px;border-radius:3px;margin-top:6px;background:rgba(0,0,0,.45);overflow:hidden}
  .sf .ab i{display:block;height:100%;width:0;border-radius:3px;background:repeating-linear-gradient(115deg,#16a34a 0 10px,#4ade80 10px 20px);background-size:200% 100%}
  .sf.run .ab i{width:100%;animation:stripes 1s linear infinite}
  .sf.boost .ab i{background:linear-gradient(90deg,#22c55e,#ffb703);animation:none}
  @keyframes stripes{to{background-position:28px 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .content{min-width:0}
  .top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 26px;background:rgba(6,11,18,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .mlogo{display:none;align-items:center;gap:6px;font-weight:900;font-size:19px;letter-spacing:2px}
  .mlogo span{color:var(--g1)}
  .mlogo .lg{width:28px;height:28px}
  .coins{font-size:26px;font-weight:900;color:var(--acc);text-shadow:0 0 22px rgba(255,183,3,.35)}
  .coins .coin{width:1em;height:1em}
  .rate{font-size:12px;color:var(--dim)}
  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .rankchip{background:linear-gradient(180deg,#0f2e1f,#08180f);border:1px solid var(--g1);color:var(--g3);border-radius:20px;padding:6px 14px;font-weight:900;font-size:13px;cursor:pointer}
  .boost{display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(34,197,94,.25),rgba(255,183,3,.16));border:1px solid rgba(255,183,3,.55);font-weight:900;font-size:13px;color:#ffe48f;position:relative;overflow:hidden}
  .boost.on{display:flex}
  .boost svg{width:15px;height:15px}
  .boost .bt{font-variant-numeric:tabular-nums}
  .boost .bb{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#22c55e,#ffb703)}
  main{max-width:1100px;margin:0 auto;padding:20px 26px 40px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,#ffc933,#ffa200);color:#1a1100;border:none;border-radius:11px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:14px;transition:transform .08s,filter .15s,box-shadow .2s;box-shadow:0 3px 0 #a86a00}
  .btn:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 3px 0 #a86a00,0 0 16px rgba(255,183,3,.35)}
  .btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #a86a00}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .btn .ico{width:1.1em;height:1.1em}
  .btn.ghost{background:var(--p2);color:var(--txt);box-shadow:0 3px 0 rgba(0,0,0,.35);border:1px solid var(--line)}
  .btn.red{background:linear-gradient(180deg,#ff6b87,#e0264a);color:#fff;box-shadow:0 3px 0 #7d1129}
  .btn.green{background:linear-gradient(180deg,#5eea90,#22b85a);color:#04280f;box-shadow:0 3px 0 #136b33}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .lnk{display:inline-flex;gap:6px;align-items:center;background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;margin-top:10px;text-decoration:underline dotted;position:relative}
  .lnk:hover{color:var(--txt)}

  /* mine */
  .mine{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px;border-radius:20px;background:linear-gradient(135deg,rgba(16,80,54,.5),rgba(10,20,30,.75));border:1px solid rgba(34,197,94,.25);box-shadow:0 10px 40px -20px #000}
  .dig{width:84px;height:84px;border-radius:20px;border:none;cursor:pointer;display:grid;place-items:center;color:#ffd9a0;background:linear-gradient(145deg,#8a5a2e,#3b2412);box-shadow:0 7px 0 #22140a,0 0 26px -6px var(--acc);user-select:none;transition:transform .05s}
  .dig .ico{width:46px;height:46px;stroke-width:2.1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .dig:active{transform:translateY(5px);box-shadow:0 2px 0 #22140a}
  .dig.auto{animation:dpulse .2s infinite}
  @keyframes dpulse{50%{transform:translateY(3px) rotate(-4deg)}}
  .mine .mt{flex:1;min-width:160px}
  .mine .mt b{font-size:19px}
  .mine .mt p{color:var(--dim);font-size:13px;margin-top:4px}
  .acl{font-size:13px;color:var(--g3);font-weight:800}
  .acrun{display:flex;flex-direction:column;gap:6px;min-width:190px}
  .acrun .ab{height:7px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
  .acrun .ab i{display:block;height:100%;width:100%;background:repeating-linear-gradient(115deg,#16a34a 0 10px,#4ade80 10px 20px);animation:stripes 1s linear infinite}

  /* headings */
  h2.t{margin:4px 0 12px;font-size:18px}
  .sect{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
  .sect h2{font-size:21px;display:flex;align-items:center;gap:10px}
  .sect h2 .ico{color:var(--g1);width:1.1em;height:1.1em}
  .sect span{color:var(--dim);font-size:13px}

  .feed{display:flex;gap:6px;align-items:center;margin-bottom:14px;color:var(--dim);font-size:12px;overflow:hidden;white-space:nowrap}
  .chip{--c:#9aa4b2;--k:#666;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--k) 55%,#0d1222);border:1px solid var(--c);flex:none}
  .chip svg{width:70%;height:70%}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
  .cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .case{position:relative;background:linear-gradient(180deg,rgba(20,44,44,.85),rgba(8,16,24,.95));border:1px solid var(--line);border-radius:22px;padding:18px 16px 14px;text-align:center;overflow:hidden;transition:border-color .2s,transform .2s}
  .case::before{content:"";position:absolute;left:50%;top:-50px;width:300px;height:300px;transform:translateX(-50%);background:radial-gradient(circle,color-mix(in srgb,var(--g) 38%,transparent),transparent 65%);pointer-events:none}
  .case:hover{border-color:var(--g);transform:translateY(-3px)}
  .case:hover .crate{transform:translateY(-6px) scale(1.06) rotate(-2deg)}
  .case h3{margin:6px 0 2px;font-size:20px;position:relative}
  .price{color:var(--acc);font-weight:900;font-size:17px;margin-bottom:10px;position:relative}
  .odds{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:14px;position:relative}
  .odds span{font-size:11px;border:1px solid var(--c);color:var(--c);border-radius:6px;padding:1px 6px;background:color-mix(in srgb,var(--c) 10%,transparent)}
  .row{display:flex;gap:8px;justify-content:center;position:relative}
  .row .btn{flex:1}
  .crate{width:140px;display:block;margin:0 auto;transition:transform .25s;filter:drop-shadow(0 10px 16px #000a);position:relative}
  .lid{transform-box:fill-box;transform-origin:center}

  /* cubes and items */
  .cf-t{fill:color-mix(in srgb,var(--k) 55%,#fff)}
  .cf-l{fill:var(--k)}
  .cf-r{fill:color-mix(in srgb,var(--k) 55%,#000)}
  .cb{width:64px;height:64px;transition:transform .2s;filter:drop-shadow(0 5px 6px #000a) drop-shadow(0 0 9px color-mix(in srgb,var(--c) 55%,transparent))}
  .item{position:relative;--c:#9aa4b2;--k:#8a93a0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#111c2a),#0a111c 80%);border:1px solid color-mix(in srgb,var(--c) 45%,#1c2a3a);border-bottom:4px solid var(--c);border-radius:14px;padding:12px 6px 9px;text-align:center;overflow:hidden;transition:transform .12s,box-shadow .2s}
  .item::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--c) 40%,transparent),transparent 65%);pointer-events:none}
  .item:hover .cb{transform:translateY(-4px) scale(1.05)}
  .item.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-18deg);animation:sheen 3s infinite;pointer-events:none}
  @keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
  .item.myth{animation:pulse 2.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 26px -2px var(--c)}}
  .item .cube{position:relative;height:66px;display:grid;place-items:center}
  .item .nm{position:relative;font-size:13px;font-weight:700}
  .item .rr{position:relative;font-size:10px;color:var(--c);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
  .item .vl{position:relative;font-size:12px;color:var(--acc);margin-top:2px;font-weight:700}
  .item .cnt{position:absolute;top:5px;right:6px;z-index:2;font-size:12px;font-weight:800;background:#000a;border-radius:8px;padding:0 6px}
  .item .newtag{position:absolute;top:5px;left:6px;z-index:2;font-size:10px;font-weight:900;background:var(--ok);color:#04280f;border-radius:8px;padding:1px 6px;letter-spacing:.5px}
  .item .acts{position:relative;display:flex;gap:4px;margin-top:7px;justify-content:center}
  .item.sel{outline:3px solid var(--g1)}
  .item.lock{border-color:#1c2a3a;border-bottom-color:#2a3a4a;background:#0a0f18}
  .item.lock::before{display:none}
  .item.lock .cube{color:#3a5060;font-size:38px;font-weight:900}
  .chance{position:relative;font-size:12px;font-weight:800;margin-top:4px;color:var(--c)}
  .tgt{cursor:pointer}
  .tgt:hover .item{transform:translateY(-3px);border-color:var(--g1)}

  .bar2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;color:var(--dim);font-size:14px;padding:12px 16px;border-radius:14px;background:var(--p1);border:1px solid var(--line)}
  .empty{color:var(--dim);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:16px}

  /* shop */
  .heroac{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px;margin-bottom:18px;border-radius:22px;background:linear-gradient(135deg,rgba(34,197,94,.2),rgba(255,183,3,.07) 60%,rgba(10,20,30,.8));border:1px solid rgba(34,197,94,.5)}
  .heroac .ic{width:84px;height:84px;display:grid;place-items:center;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--g3)}
  .heroac .ic .ico{width:48px;height:48px}
  .heroac .tx{flex:1;min-width:200px}
  .heroac .tx b{font-size:20px}
  .heroac .tx p{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
  .tagown{display:inline-block;font-size:10px;font-weight:900;letter-spacing:1px;padding:2px 9px;border-radius:10px;background:var(--ok);color:#04280f;margin-left:8px;vertical-align:middle}
  .ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .up{background:linear-gradient(180deg,rgba(20,44,44,.6),rgba(8,16,24,.85));border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px}
  .up .ic{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--g3);flex:none}
  .up .ic .ico{width:28px;height:28px}
  .up .tx{flex:1;min-width:0}
  .up .tx b{font-size:15px}
  .up .tx p{font-size:12px;color:var(--dim);margin-top:2px}
  .lvl{color:var(--g3);font-weight:800;font-size:11px;margin-left:6px}
  .upbar{height:6px;border-radius:3px;background:rgba(0,0,0,.45);margin-top:8px;overflow:hidden}
  .upbar i{display:block;height:100%;background:linear-gradient(90deg,#15803d,#22c55e,#86efac)}

  /* promo */
  .promo{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .pcard{position:relative;overflow:hidden;border-radius:22px;padding:24px;background:linear-gradient(145deg,rgba(34,197,94,.18),rgba(10,20,30,.88));border:1px solid rgba(34,197,94,.45)}
  .pcard::after{content:"";position:absolute;right:-16px;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:var(--bg);border:1px solid rgba(34,197,94,.45)}
  .pcard::before{content:"";position:absolute;left:-16px;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:var(--bg);border:1px solid rgba(34,197,94,.45)}
  .pcard h3{font-size:20px;display:flex;align-items:center;gap:10px}
  .pcard h3 .ico{color:var(--g1);width:26px;height:26px}
  .pcard p{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.45}
  .pform{display:flex;gap:8px;margin-top:16px}
  .pform input{flex:1;min-width:0;background:rgba(0,0,0,.4);border:1px solid rgba(34,197,94,.4);border-radius:12px;padding:12px 14px;color:#fff;font-size:16px;font-weight:800;letter-spacing:1.5px;outline:none}
  .pform input:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .pmsg{min-height:22px;margin-top:12px;font-weight:700;font-size:14px}
  .pmsg.ok{color:var(--ok)}.pmsg.bad{color:var(--bad)}
  .pl{display:grid;gap:10px}
  .pl h4{font-size:12px;letter-spacing:2px;color:#5e8a78;text-transform:uppercase;margin:2px 4px}
  .pitem{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--p1);border:1px solid var(--line)}
  .pitem .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--g3);flex:none}
  .pitem .pic .ico,.pitem .pic .coin{width:22px;height:22px;margin:0}
  .pitem .ptx{flex:1;min-width:0}
  .pitem .ptx b{font-size:14px}
  .pitem .ptx p{font-size:12px;color:var(--dim);margin-top:2px}
  .pitem.done{opacity:.65}
  .pitem.live{border-color:rgba(255,183,3,.6);background:linear-gradient(135deg,rgba(255,183,3,.12),rgba(34,197,94,.08))}
  .pitem.live .pic{color:#ffe48f;border-color:rgba(255,183,3,.5);background:rgba(255,183,3,.12)}
  .ptag{font-size:10px;font-weight:900;letter-spacing:1px;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--dim);white-space:nowrap}
  .ptag.y{background:var(--ok);color:#04280f}
  .bt2{font-variant-numeric:tabular-nums;font-weight:800;color:#ffe48f}

  /* leaderboard */
  .prof{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(16,80,54,.55),rgba(10,20,30,.85));border:1px solid rgba(34,197,94,.3);border-radius:20px;padding:16px 18px;margin-bottom:14px}
  .av{width:70px;height:70px;border-radius:50%;border:3px solid var(--g1);cursor:pointer;box-shadow:0 0 22px -4px var(--g1);transition:transform .15s}
  .av:hover{transform:rotate(-8deg) scale(1.06)}
  .pinfo{min-width:0}
  .pinfo input{background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--txt);font-size:20px;font-weight:800;width:100%;outline:none;padding:2px 0}
  .pinfo input:focus{border-color:var(--g1)}
  .ttl{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#04280f;background:linear-gradient(90deg,#86efac,#22c55e);padding:2px 10px;border-radius:20px}
  .pr{text-align:center}
  .rk{font-size:38px;font-weight:900;color:var(--acc);text-shadow:0 0 20px rgba(255,183,3,.4);line-height:1}
  .rl{font-size:11px;color:var(--dim);margin-top:2px}
  .showc{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--dim)}
  .sc{--c:#9aa4b2;--k:#8a93a0;width:54px;height:54px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,#0d1222);border:1px solid var(--c);box-shadow:0 0 14px -4px var(--c)}
  .sc .cb{width:44px;height:44px}
  .gap{margin-left:auto;color:var(--txt);font-weight:700}
  .lbtabs{display:flex;gap:6px;flex-wrap:wrap}
  .lbtabs button{flex:1;min-width:120px;background:var(--p1);color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
  .lbtabs button:hover{color:var(--txt)}
  .lbtabs button.on{background:rgba(34,197,94,.15);color:var(--txt);border-color:var(--g1)}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:24px 0 14px}
  .pcol{--pc:#fff;flex:1;max-width:200px;min-width:0;text-align:center}
  .pcol.p1{--pc:#ffd166}.pcol.p2{--pc:#cfd6e6}.pcol.p3{--pc:#e09a5a}
  .crown{width:28px;height:28px;color:var(--pc);animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--pc))}
  .pcol.p1 .crown{width:40px;height:40px}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .pav{width:62px;height:62px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--pc)}
  .pcol.p1 .pav{width:80px;height:80px;box-shadow:0 0 34px -2px var(--pc)}
  .pn{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
  .pv{font-size:12px;color:var(--acc);font-weight:800;margin-bottom:6px}
  .pb{border-radius:12px 12px 0 0;display:grid;place-items:center;font-size:32px;font-weight:900;color:#1a1100;background:linear-gradient(180deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#0b1024))}
  .p1 .pb{height:122px}.p2 .pb{height:90px}.p3 .pb{height:66px}
  .pcol.me .pn{color:var(--g3)}
  .pcol.me .pav{outline:3px solid var(--g1);outline-offset:3px}
  .lrow{display:grid;grid-template-columns:34px 42px 1fr auto auto;gap:10px;align-items:center;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:6px}
  .lrow.me{border-color:var(--g1);background:linear-gradient(90deg,rgba(34,197,94,.2),var(--p1))}
  .lr{font-weight:900;color:var(--dim);text-align:center}
  .lav{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
  .lnm{min-width:0}
  .lnm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lnm small{color:var(--dim);font-size:11px}
  .lbar{height:5px;background:rgba(0,0,0,.45);border-radius:3px;margin-top:4px;overflow:hidden}
  .lbar i{display:block;height:100%;background:linear-gradient(90deg,#15803d,#22c55e,#86efac)}
  .lv{font-weight:800;color:var(--acc);min-width:84px;text-align:right;font-size:14px}
  .sep{text-align:center;color:var(--dim);margin:2px 0 8px;letter-spacing:4px}
  .note{text-align:center;color:var(--dim);font-size:11px;margin-top:14px}

  /* modal */
  #modal{position:fixed;inset:0;background:radial-gradient(circle,rgba(4,12,14,.9),rgba(2,5,8,.96));display:none;place-items:center;z-index:50;padding:14px}
  #modal.show{display:grid}
  .mbox{background:linear-gradient(180deg,#0f2a26,#091318);border:1px solid #1f4a3c;border-radius:24px;padding:22px;width:min(920px,100%);max-height:94vh;overflow:auto;text-align:center;position:relative}
  .mbox.glow{box-shadow:0 0 90px -10px var(--gc);border-color:var(--gc)}
  .mbox.shake{animation:mshake .5s}
  @keyframes mshake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
  .mbox h2{margin-bottom:12px;letter-spacing:.5px}
  .mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

  /* opening */
  .stage{min-height:300px;display:grid;place-items:center}
  .crateWrap{position:relative;width:210px;margin:14px auto;--g:#fff}
  .crateWrap .aura{position:absolute;left:50%;top:52%;width:400px;height:400px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--g),transparent 62%);opacity:.5;pointer-events:none;filter:blur(6px)}
  .crateWrap .aura.a2{background:radial-gradient(circle,var(--tc),transparent 62%);opacity:0;transition:opacity .5s}
  .crateWrap.hint .aura.a2{opacity:.8}
  .ring{position:absolute;left:50%;top:52%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--g);opacity:0;animation:ringp 1.1s infinite;pointer-events:none}
  .ring.r2{animation-delay:.55s}
  .crateWrap.hint .ring{border-color:var(--tc)}
  @keyframes ringp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
  .crateWrap .crate{width:100%;overflow:visible;position:relative;transition:none;filter:drop-shadow(0 0 28px var(--g))}
  .crateWrap.hint .crate{filter:drop-shadow(0 0 34px var(--tc))}
  .crateWrap.open .lid{animation:lid .7s forwards}
  @keyframes lid{to{transform:translate(6px,-56px) rotate(-16deg);opacity:0}}
  .crateWrap.open::before{content:"";position:absolute;left:50%;bottom:45%;width:120px;height:360px;transform:translateX(-50%);background:linear-gradient(to top,var(--tc),transparent);filter:blur(10px);opacity:0;animation:beam .8s forwards;z-index:2}
  @keyframes beam{0%{opacity:0;height:40px}40%{opacity:.95}100%{opacity:.6;height:360px}}
  .chg{height:8px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;width:min(320px,80%);margin:4px auto 0;border:1px solid rgba(255,255,255,.08)}
  .chg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),#fff)}

  .rows{--pc:#ffb703;position:relative;display:grid;gap:8px;width:100%}
  .rwin{position:relative;overflow:hidden;border-radius:12px;background:#060d14;border:1px solid var(--line);padding:8px 0}
  .rwin::before,.rwin::after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none}
  .rwin::before{left:0;background:linear-gradient(90deg,#060d14,transparent)}
  .rwin::after{right:0;background:linear-gradient(-90deg,#060d14,transparent)}
  .spot{position:absolute;left:50%;top:0;bottom:0;width:150px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pc) 24%,transparent),transparent);z-index:3;pointer-events:none}
  .pointer{position:absolute;left:50%;top:-6px;bottom:-6px;width:3px;background:linear-gradient(var(--pc),#fff,var(--pc));transform:translateX(-50%);z-index:4;box-shadow:0 0 16px var(--pc);pointer-events:none}
  .pointer::before,.pointer::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:8px solid transparent}
  .pointer::before{top:0;border-top-color:var(--pc)}
  .pointer::after{bottom:0;border-bottom-color:var(--pc)}
  .shock{position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:linear-gradient(90deg,transparent,var(--pc),transparent);z-index:5;pointer-events:none;animation:shock .8s forwards}
  @keyframes shock{0%{opacity:.95;transform:scaleX(1)}100%{opacity:0;transform:scaleX(34)}}
  .strip{display:flex;will-change:transform}
  .strip .item{flex:none;width:120px;margin:0 4px}
  .strip .item.hot{transform:scale(1.07)}
  .rows.done .strip .item{opacity:.3;transition:opacity .4s}
  .rows.done .strip .item.win{opacity:1;transform:scale(1.1);box-shadow:0 0 34px -2px var(--c)}
  .rows.mini .strip .item{width:84px;padding:6px 4px}
  .rows.mini .cube{height:44px}
  .rows.mini .cb{width:40px;height:40px}
  .rows.mini .nm{font-size:10px}
  .rows.mini .rr,.rows.mini .vl{display:none}

  .reveal{position:relative;display:grid;place-items:center;padding:30px 0 16px;overflow:hidden;border-radius:16px}
  .rays{position:absolute;width:600px;height:600px;left:50%;top:48%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 45%,transparent) 0 9deg,transparent 9deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 66%);mask-image:radial-gradient(circle,#000 0,transparent 66%);animation:spinr 16s linear infinite;opacity:.65}
  @keyframes spinr{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .rvband{position:relative;margin-bottom:14px;padding:4px 18px;border-radius:20px;font-weight:900;letter-spacing:3px;font-size:12px;text-transform:uppercase;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.4));box-shadow:0 0 20px -4px var(--c);animation:pop .5s both .1s cubic-bezier(.2,1.4,.4,1)}
  .rvcard{position:relative;width:220px;animation:pop .65s cubic-bezier(.2,1.6,.4,1)}
  .rvcard .item .cube{height:136px}
  .rvcard .item .cb{width:124px;height:124px;animation:bobc 3s ease-in-out infinite}
  @keyframes bobc{50%{transform:translateY(-7px)}}
  .rvcard .item .nm{font-size:18px}
  .flav{position:relative;margin-top:10px;color:var(--dim);font-style:italic;font-size:13px}
  .rvstats{position:relative;display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .rvstats div{min-width:92px;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
  .rvstats small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  .rvstats b{font-size:15px;color:var(--acc)}
  @keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
  .pi{animation:pop .45s both cubic-bezier(.2,1.4,.4,1)}

  .flash{position:fixed;inset:0;z-index:65;pointer-events:none;animation:fl2 .9s forwards}
  @keyframes fl2{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}

  .cmp{display:flex;align-items:center;justify-content:center;gap:14px}
  .cmp .item{width:140px}
  .arrow{color:var(--acc)}
  .arrow .ico{width:34px;height:34px}
  .bar{position:relative;height:28px;background:#2a1018;border-radius:14px;overflow:hidden;margin:18px 0 8px;border:1px solid #3b2a30}
  .zone{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#16a34a,#4ade80)}
  .ptr{position:absolute;top:-2px;bottom:-2px;left:0;width:4px;background:#fff;box-shadow:0 0 10px #fff;transform:translateX(-50%)}
  .res-win{color:var(--ok);font-weight:900;font-size:24px}
  .res-lose{color:var(--bad);font-weight:900;font-size:24px}

  #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:rgba(0,0,0,.88);border:1px solid #1f4a3c;padding:9px 16px;border-radius:12px;font-size:14px;animation:tt 2.6s forwards}
  @keyframes tt{0%{opacity:0;transform:translateY(10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
  .fl{position:fixed;pointer-events:none;font-weight:900;color:var(--acc);z-index:60;animation:flt .8s forwards;text-shadow:0 2px 6px #000}
  @keyframes flt{to{transform:translateY(-60px);opacity:0}}
  footer{text-align:center;margin-top:26px}

  @media(max-width:900px){
    .promo{grid-template-columns:1fr}
  }
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;overflow:visible;flex-direction:row;padding:6px;gap:0;z-index:40;border-right:0;border-top:1px solid rgba(34,197,94,.35)}
    .brand,.me,.sidefoot,.ngrp{display:none}
    .navs{flex-direction:row;width:100%;gap:2px}
    .nv{flex:1;grid-template-columns:1fr;grid-template-rows:auto auto auto;justify-items:center;row-gap:3px;padding:6px 2px;font-size:9.5px;min-width:0}
    .nv .ni{grid-row:auto;width:32px;height:32px;border-radius:10px}
    .nv .ni .ico{width:18px;height:18px}
    .nv:hover{transform:none}
    .nv.on::before{left:20%;right:20%;top:-7px;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
    .nl{justify-content:center}.nt{display:none}
    .nbar{height:4px;width:100%}
    .mlogo{display:flex}
    .top{padding:10px 14px}
    main{padding:14px 14px 110px}
    .lrow{grid-template-columns:28px 38px 1fr auto}.lbest{display:none}
    .prof{grid-template-columns:auto 1fr}.pr{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;justify-content:center}
    .cmp .item{width:100px}
    .strip .item{width:100px}
    .pcard::before,.pcard::after{display:none}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="lg" viewBox="0 0 64 64" style="--k:#22c55e"><path class="cf-t" d="M32 6L56 18 32 30 8 18z"/><path class="cf-l" d="M8 18L32 30V58L8 46z"/><path class="cf-r" d="M32 30L56 18V46L32 58z"/><path d="M8 18L32 30 56 18M32 30V58" stroke="#fff" stroke-opacity=".35" fill="none"/></svg>
      <div>LUCKY<span>BLOX</span></div>
    </div>
    <div class="me" onclick="go('top')">
      <div class="mer">
        <div class="meav" id="sAv"></div>
        <div class="meinfo"><b id="sName">Игрок</b><small id="sTitle"></small></div>
        <div class="merank" id="sRank">#</div>
      </div>
      <div class="xp"><i id="xpf"></i></div>
      <div class="xpt" id="xpt"></div>
    </div>
    <div class="navs" id="nav"></div>
    <div class="sidefoot">
      <div class="sf" id="sfAuto"><div class="sfi"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></div><div class="sfb"><b>Автокликер</b><small id="sAutoT"></small><div class="ab"><i></i></div></div></div>
      <div class="sf boost" id="sfBoost"><div class="sfi"><svg class="ico f" viewBox="0 0 24 24"><path d="M13 2L5 13h6l-1 9 9-12h-6z"/></svg></div><div class="sfb"><b>Множитель</b><small id="sBoostT"></small><div class="ab"><i id="sBoostB"></i></div></div></div>
    </div>
  </aside>

  <div class="content">
    <header class="top">
      <div class="mlogo">
        <svg class="lg" viewBox="0 0 64 64" style="--k:#22c55e"><path class="cf-t" d="M32 6L56 18 32 30 8 18z"/><path class="cf-l" d="M8 18L32 30V58L8 46z"/><path class="cf-r" d="M32 30L56 18V46L32 58z"/></svg>
        <div>LUCKY<span>BLOX</span></div>
      </div>
      <div><div class="coins" id="coins"></div><div class="rate" id="rate"></div></div>
      <div class="boost" id="boost"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L5 13h6l-1 9 9-12h-6z"/></svg><span>x1.5</span><span class="bt" id="boostT"></span><i class="bb" id="boostB"></i></div>
      <div class="hud">
        <button class="rankchip" id="rank" onclick="go('top')"></button>
        <button class="btn green sm" id="bonus" onclick="claimBonus()"></button>
      </div>
    </header>

    <main>
      <section class="mine">
        <button class="dig" id="dig" onclick="dig(event)"></button>
        <div class="mt"><b>Копай блоки</b><p id="digInfo"></p></div>
        <div id="acBuy"></div>
        <div id="acCtl" class="acrun" style="display:none">
          <span class="acl">Автокликер · 5 кликов/сек</span>
          <div class="ab"><i></i></div>
        </div>
      </section>
      <div id="view"></div>
    </main>
  </div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
// ---------- Иконки интерфейса ----------
const ICO = {
  cases:'<path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/>',
  inv:'<path d="M8 6V5a4 4 0 018 0v1"/><rect x="4" y="6" width="16" height="15" rx="4"/><path d="M8 14h8M9 10h6"/>',
  upg:'<path d="M6 11l6-6 6 6M6 19l6-6 6 6"/>',
  shop:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  promo:'<path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4z"/><path d="M14 7.5v2M14 11v2M14 14.5v2"/>',
  top:'<path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 21h8M9 18h6"/>',
  col:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>',
  pick:'<path d="M3 10c3-5 15-5 18 0"/><path d="M12 6.5V21"/>',
  gear:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  bolt:'<path d="M13 2L5 13h6l-1 9 9-12h-6z"/>',
  gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 14h18"/><path d="M12 9C9 9 7 7 8.5 5.5S12 6 12 9zM12 9c3 0 5-2 3.5-3.5S12 6 12 9z"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  clover:'<circle cx="9" cy="9" r="3.2"/><circle cx="15" cy="9" r="3.2"/><circle cx="9" cy="15" r="3.2"/><circle cx="15" cy="15" r="3.2"/><path d="M12 12l5 8"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  dollar:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.700 2.500 2 2.500.8 2.500 2-1 2-2.500 2c-1 0-2-.5-2.500-1.500M12 6v1.500M12 16.500V18"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  robot:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4M9.5 13h.01M14.5 13h.01M9.500 16.500h5"/><circle cx="12" cy="3.500" r="1"/>',
  flame:'<path d="M12 3c1 4 6 6 6 11a6 6 0 01-12 0c0-3 2-4 3-7 1 1.500 2 1.500 3-4z"/>',
  next:'<path d="M5 12h14M13 6l6 6-6 6"/>'

let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type='sine', v=.08, when=0, slide=0){
  const a = ac(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02);
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){
  n = Math.floor(n);
  if(n < 1000) return '' + n;
  const s = ['','K','M','B','T']; let i = 0, x = n;
  while(x >= 1000 && i < 4){ x /= 1000; i++; }
  return (x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2)) + s[i];
}
const C = n => `<span class="cn">${COIN}${fmt(n)}</span>`;
function setH(id, html){ const e = $(id); if(e && e._h !== html){ e._h = html; e.innerHTML = html; } }
function toast(t){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  $('toasts').appendChild(d); setTimeout(()=>d.remove(), 2600);
}
const clickPower = l => 2 + l*2;
const autoRate   = l => l*1.5;
const casePrice  = c => Math.max(1, Math.floor(c.price * (1 - S.up.disc*0.02)));
const sellPrice  = id => Math.floor(ITEMS[id].v * (1 + S.up.sell*0.03));
const maxMulti   = () => MULTI[S.up.multi];
const boostLeft  = () => Math.max(0, (S.boostUntil||0) - Date.now());
const mult       = () => boostLeft() > 0 ? BOOST_X : 1;
const mmss       = ms => { const s = Math.ceil(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

function chances(c){
  const w = c.w.map((x,i) => x * (1 + S.up.luck*0.05*i));
  const t = w.reduce((a,b)=>a+b, 0);
  return w.map(x => x/t);
}
function rollItem(c){
  const p = chances(c); let r = Math.random(), ri = 0;
  for(let i=0;i<p.length;i++){ r -= p[i]; ri = i; if(r <= 0) break; }
  while(p[ri] === 0 && ri > 0) ri--;
  const pool = ITEMS.map((it,id)=>({it,id})).filter(o => o.it.r === ri);
  return pool[Math.floor(Math.random()*pool.length)].id;
}
function giveItem(id){
  S.inv[id] = (S.inv[id]||0) + 1; S.seen[id] = 1;
  if(S.best < 0 || ITEMS[id].v > ITEMS[S.best].v) S.best = id;
}

// ---------- Лидерборд: расчёт ----------
const hrs = () => Math.max(0, (Date.now() - S.t0) / 3.6e6);
function botWorth(b, i){ const h = hrs(); return b.base * (1 + b.r*h) * (1 + .04*Math.sin(h*1.7 + i*2.1)); }
function bestBelow(lim){ let id = SORTED[0]; for(const k of SORTED){ if(ITEMS[k].v <= lim) id = k; else break; } return id; }
function netWorth(){ let t = S.coins; for(const k in S.inv) t += ITEMS[k].v * S.inv[k]; return t; }
function titleOf(w){ let t = TITLES[0][1]; for(const [m,n] of TITLES) if(w >= m) t = n; return t; }
function board(cat){
  const L = BOTS.map((b,i) => {
    const w = botWorth(b,i), bi = bestBelow(w*.4);
    return {name:b.n, av:b.av, w, best:bi, bv:ITEMS[bi].v, op:Math.floor(w/40), me:false};
  });
  const bi = S.best;
  L.push({name:S.name, av:S.av, w:netWorth(), best:bi, bv:bi>=0?ITEMS[bi].v:0, op:S.opened, me:true});
  const key = {worth:'w', best:'bv', opened:'op'}[cat];
  L.sort((a,b) => b[key] - a[key]);
  L.forEach((e,i) => e.rank = i+1);
  return {L, key};
}
function checkRank(){
  const L = board('worth').L, r = L.find(e => e.me).rank;
  if(S.bestRank === 99){ S.bestRank = r; return [r, L.length]; }
  if(r < S.bestRank){
    const below = L[r];
    S.bestRank = r; sfx.rank();
    toast(`Ты поднялся на #${r}` + (below ? `, обошёл ${below.name}` : ''));
    save();
  }
  return [r, L.length];
}
function lbVal(e, cat){
  if(cat === 'worth') return C(e.w);
  if(cat === 'best') return e.best >= 0 ? fmt(e.bv) : '—';
  return fmt(e.op) + ' кейсов';
}

// ---------- Меню с полосками ----------
const TABS = [
  ['cases','cases','Кейсы','Игра'],
  ['inv','inv','Инвентарь'],
  ['upg','upg','Апгрейдер'],
  ['shop','shop','Магазин','Развитие'],
  ['promo','promo','Промокоды'],
  ['top','top','Топ','Сообщество'],
  ['col','col','Коллекция']
];
function navStats(k, rk){
  if(k === 'cases'){ const n = CASES.filter(c => S.coins >= casePrice(c)).length; return [n/CASES.length, n+'/'+CASES.length]; }
  if(k === 'inv'){ const n = Object.values(S.inv).reduce((a,b)=>a+b, 0); return [Math.min(1, n/60), n+' шт']; }
  if(k === 'upg'){
    if(S.best < 0) return [0, '—'];
    return [(SORTED.indexOf(S.best)+1)/ITEMS.length, ITEMS[S.best].n.slice(0,9)];
  }
  if(k === 'shop'){
    const tot = UPS.reduce((a,u)=>a+u.max, 0) + 1, have = UPS.reduce((a,u)=>a+S.up[u.k], 0) + (S.auto?1:0);
    return [have/tot, Math.round(have/tot*100)+'%'];
  }
  if(k === 'promo'){
    const tot = Object.keys(CODES).length, used = Object.keys(S.codes).filter(x => CODES[x]).length;
    return [boostLeft() > 0 ? 1 : used/tot, boostLeft() > 0 ? 'x1.5' : used+'/'+tot];
  }
  if(k === 'top') return [(rk[1]-rk[0])/(rk[1]-1), '#'+rk[0]];
  const got = ITEMS.filter((_,id)=>S.seen[id]).length;
  return [got/ITEMS.length, got+'/'+ITEMS.length];
}
function updateNav(rk){
  TABS.forEach(([k]) => {
    const f = $('nf_'+k), t = $('nt_'+k); if(!f) return;
    const [p, txt] = navStats(k, rk);
    f.style.width = Math.max(3, Math.min(1, p)*100) + '%'; t.textContent = txt;
  });
  const w = netWorth();
  let ci = 0; TITLES.forEach(([m],i) => { if(w >= m) ci = i; });
  const nxt = TITLES[ci+1];
  if(nxt){
    $('xpf').style.width = Math.max(2, (w - TITLES[ci][0])/(nxt[0] - TITLES[ci][0])*100) + '%';
    $('xpt').textContent = `До «${nxt[1]}»: ${fmt(nxt[0]-w)} монет`;
  } else { $('xpf').style.width = '100%'; $('xpt').textContent = 'Максимальное звание'; }
}

}
function previewCase(ci){
  const c = CASES[ci], p = chances(c);
  const cntR = r => ITEMS.filter(x => x.r === r).length;
  const ids = ITEMS.map((_,i)=>i).filter(i => p[ITEMS[i].r] > 0).sort((a,b)=>ITEMS[b].v - ITEMS[a].v);
  openModal(`<h2>${c.n}: содержимое</h2>
    <div class="grid">${ids.map(id => card(id, `<div class="chance">${(p[ITEMS[id].r]/cntR(ITEMS[id].r)*100).toFixed(2)}%</div>`)).join('')}</div>
    <div class="mbtns">
      <button class="btn" onclick="again(${ci},1)">Открыть ${C(casePrice(c))}</button>
      <button class="btn ghost" onclick="closeModal()">Закрыть</button>
    </div>`);
}
function openCase(ci, count){
  if(busy) return;
  const c = CASES[ci], total = casePrice(c) * count;
  if(S.coins < total){ toast('Не хватает монет'); return; }
  S.coins -= total; S.opened += count;
  const res = [], fresh = new Set();
  for(let i=0;i<count;i++){
    const id = rollItem(c); res.push(id);
    if(!S.seen[id]) fresh.add(id);
    giveItem(id); S.feed.unshift(id);
  }
  S.feed = S.feed.slice(0,10);
  save(); updateHUD();
  startOpening(ci, res, fresh);
}

// ---------- Модалка ----------
function openModal(html, glowColor){
  const b = $('mbox');
  b.className = 'mbox' + (glowColor ? ' glow' : '');
  if(glowColor) b.style.setProperty('--gc', glowColor);
  b.innerHTML = html;
  $('modal').classList.add('show');
}
function closeModal(){
  if(busy) return;
  $('modal').classList.remove('show');
  render();
}
$('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('modal').classList.contains('show')) closeModal(); });

// ---------- Открытие кейса ----------
function startOpening(ci, res, fresh){
  busy = true; ac();
  const c = CASES[ci];
  const top = Math.max(...res.map(i => ITEMS[i].r)), tc = RAR[top].c;
  openModal(`<div class="cine" style="--g:${c.a};--tc:${tc}">
    <h2>${c.n}${res.length>1?' x'+res.length:''}</h2>
    <div class="stage" id="stage">
      <div class="crateWrap" id="cw"><div class="aura"></div><div class="aura a2"></div><i class="ring"></i><i class="ring r2"></i>${crate(c,'o'+ci)}</div>
    </div>
    <div class="chg"><i id="chg"></i></div>
    <div class="mbtns"><button class="btn ghost" onclick="skipNow()">Пропустить</button></div>
  </div>`);
  const cw = $('cw'), cr = cw.querySelector('.crate'), bar = $('chg');
  const DUR = 2200, t0 = performance.now();
  let skipped = false, nextTick = 0, hinted = false;
  skipFn = () => { skipped = true; };
  sfx.rumble(); sfx.sweep(DUR/1000);
  const center = () => { const r = cw.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height*.55]; };
  function frame(now){
    const p = skipped ? 1 : Math.min(1, (now - t0)/DUR);
    const amp = 1 + p*p*13;
    cr.style.transform = `translate(${(Math.random()-.5)*amp}px,${(Math.random()-.5)*amp}px) rotate(${(Math.random()-.5)*amp*.5}deg) scale(${1+p*.14})`;
    bar.style.width = (p*100) + '%';
    if(!skipped){
      const [cx,cy] = center();
      FX.suck(cx, cy, p > .68 ? tc : c.a, 1 + Math.floor(p*3));
      if(!hinted && p > .68){ hinted = true; cw.classList.add('hint'); }
      if(now > nextTick){ sfx.chtick(p); nextTick = now + 240 - p*170; }
    }
    if(p < 1){ requestAnimationFrame(frame); return; }
    cr.style.transform = '';
    cw.classList.add('hint'); cw.classList.add('open'); sfx.open();
    const [cx,cy] = center(); FX.burst(cx, cy, tc, 40);
    flash(tc);
    skipFn = null;
    setTimeout(() => buildRoulette(ci, res, fresh, top), skipped ? 150 : 750);
  }
  requestAnimationFrame(frame);
}
function buildRoulette(ci, res, fresh, top){
  const c = CASES[ci], n = res.length, WIN = 46, N = 54;
  const idsAll = [];
  let rows = '';
  for(let k=0;k<n;k++){
    let cells = '', ids = [];
    for(let i=0;i<N;i++){ const id = i===WIN ? res[k] : rollItem(c); ids.push(id); cells += card(id); }
    idsAll.push(ids);
    rows += `<div class="rwin"><div class="strip">${cells}</div></div>`;
  }
  $('stage').innerHTML = `<div style="width:100%">
    <div class="rows ${n>1?'mini':''}" id="rows">${rows}<div class="spot"></div><div class="pointer"></div></div></div>`;

  const box = $('rows'), strips = [...box.querySelectorAll('.strip')];
  const vw = box.clientWidth;
  const pitch = strips[0].children[1].offsetLeft - strips[0].children[0].offsetLeft;
  const targets = strips.map(() => WIN*pitch + pitch/2 - vw/2 + (Math.random()-.5)*pitch*.7);
  const durs = strips.map((_,k) => (n>1 ? 5200 : 7000) + k*260);
  const last = strips.map(() => -1);
  let skip = false; skipFn = () => { skip = true; };
  const t0 = performance.now();

  function frame(now){
    let alive = false;
    strips.forEach((s,k) => {
      const x = skip ? 1 : Math.min(1, (now - t0)/durs[k]);
      const pos = targets[k] * (1 - Math.pow(1-x, 5));
      s.style.transform = `translate3d(${-pos}px,0,0)`;
      const idx = Math.floor((pos + vw/2)/pitch);
      if(idx !== last[k]){
        const ch = s.children;
        if(ch[last[k]]) ch[last[k]].classList.remove('hot');
        if(ch[idx]) ch[idx].classList.add('hot');
        last[k] = idx;
        if(k === 0 && idsAll[0][idx] !== undefined){
          const rr = ITEMS[idsAll[0][idx]].r;
          box.style.setProperty('--pc', RAR[rr].c);
          if(!skip) sfx.tick(rr);
        }
      }
      if(x < 1) alive = true;
    });
    if(alive){ requestAnimationFrame(frame); return; }
    skipFn = null;
    strips.forEach(s => { [...s.children].forEach(ch => ch.classList.remove('hot')); s.children[WIN].classList.add('win'); });
    box.classList.add('done');
    const col = RAR[top].c;
    box.style.setProperty('--pc', col);
    const sh = document.createElement('i'); sh.className = 'shock'; box.appendChild(sh);
    const r = box.getBoundingClientRect();
    FX.burst(r.left + r.width/2, r.top + r.height/2, col, 26);
    sfx.tick(5);
    setTimeout(() => finishOpen(ci, res, fresh), skip ? 250 : 1000);
  }
  requestAnimationFrame(frame);
}
function skipNow(){ if(skipFn) skipFn(); }

const NEWTAG = `<div class="newtag">NEW</div>`;
function finishOpen(ci, res, fresh){
  busy = false;
  const top = Math.max(...res.map(id => ITEMS[id].r));
  if(res.length === 1) revealOne(ci, res[0], fresh.has(res[0]));
  else showResults(ci, res, fresh);
  sfx.win(top);
  const col = RAR[top].c;
  if(top >= 2) flash(col);
  if(top >= 3) FX.burst(innerWidth/2, innerHeight*.4, col, 30 + top*14, true);
  if(top >= 4){
    setTimeout(() => FX.burst(innerWidth/2, innerHeight*.4, col, 40, true), 350);
    const b = $('mbox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }
}
function revealOne(ci, id, isNew){
  const it = ITEMS[id], r = RAR[it.r], p = chances(CASES[ci]);
  const cnt = ITEMS.filter(x => x.r === it.r).length, ch = p[it.r]/cnt*100;
  const got = ITEMS.filter((_,i) => S.seen[i]).length;
  openModal(`<div class="reveal" style="--c:${r.c}">
      <div class="rays"></div>
      <div class="rvband">${r.n}</div>
      <div class="rvcard">${card(id, isNew ? NEWTAG : '')}</div>
      <div class="flav">${it.t}</div>
      <div class="rvstats">
        <div><small>Цена</small><b>${C(it.v)}</b></div>
        <div><small>Шанс</small><b>${ch < 1 ? ch.toFixed(2) : ch.toFixed(1)}%</b></div>
        <div><small>Коллекция</small><b>${got}/${ITEMS.length}</b></div>
      </div>
    </div>
    <div class="mbtns">
      <button class="btn" onclick="closeModal()">Забрать</button>
      <button class="btn green" onclick="sellFromModal([${id}])">Продать ${C(sellPrice(id))}</button>
      <button class="btn ghost" onclick="again(${ci},1)">Ещё раз</button>
    </div>`, it.r >= 4 ? r.c : null);
}
function showResults(ci, list, fresh){
  const c = CASES[ci], cnt = {};
  list.forEach(id => cnt[id] = (cnt[id]||0) + 1);
  const ids = Object.keys(cnt).map(Number).sort((a,b)=>ITEMS[b].v - ITEMS[a].v);
  const sum = list.reduce((a,id)=>a+ITEMS[id].v, 0);
  const sellSum = list.reduce((a,id)=>a+sellPrice(id), 0);
  const top = Math.max(...list.map(id=>ITEMS[id].r));
  openModal(`<h2>${c.n} x${list.length}</h2>
    <div class="grid">${ids.map((id,i) => `<div class="pi" style="animation-delay:${i*80}ms">${card(id, fresh.has(id) ? NEWTAG : '', '', cnt[id])}</div>`).join('')}</div>
    <p style="margin-top:14px;color:var(--dim)">Общая стоимость: ${C(sum)}</p>
    <div class="mbtns">
      <button class="btn" onclick="closeModal()">Забрать</button>
      <button class="btn green" onclick="sellFromModal([${list.join(',')}])">Продать всё ${C(sellSum)}</button>
      <button class="btn ghost" onclick="again(${ci},${list.length})">Ещё x${list.length}</button>
    </div>`, top >= 4 ? RAR[top].c : null);
}
function again(ci, n){ $('modal').classList.remove('show'); openCase(ci, n); }
function sellFromModal(list){
  let gain = 0;
  list.forEach(id => { if(S.inv[id] > 0){ S.inv[id]--; gain += sellPrice(id); } });
  S.coins += gain; save(); sfx.coin(); toast('Продано: +' + fmt(gain));
  busy = false; closeModal();
}
function flash(color){
  const f = document.createElement('div'); f.className = 'flash';
  f.style.background = `radial-gradient(circle,#fff,${color} 40%,transparent 75%)`;
  $('modal').appendChild(f); setTimeout(() => f.remove(), 900);
}

// ---------- Инвентарь ----------
function invIds(){
  return Object.keys(S.inv).map(Number).filter(id => S.inv[id] > 0).sort((a,b)=>ITEMS[b].v - ITEMS[a].v);
}
function vInv(){
  const ids = invIds();
  const total = ids.reduce((a,id)=>a + sellPrice(id)*S.inv[id], 0);
  const h = head('inv','Инвентарь','Продавай или улучшай');
  if(!ids.length) return h + `<div class="empty">Инвентарь пуст. Открой кейс.</div>`;
  return h + `<div class="bar2">
      <span>Стоимость всего: <b style="color:var(--acc)">${C(total)}</b></span>
      <button class="btn sm red" onclick="sellBelow(3)">Продать всё ниже Эпика</button>
      <button class="btn sm ghost" onclick="sellBelow(4)">Продать всё ниже Легендарного</button>
    </div>
    <div class="grid">${ids.map(id => card(id, `
      <div class="acts">
        <button class="btn sm green" onclick="sellOne(${id})">Продать</button>
        <button class="btn sm ghost" onclick="pickUpg(${id})">Апгрейд</button>
      </div>`, '', S.inv[id])).join('')}</div>`;
}
function sellOne(id){
  if(!(S.inv[id] > 0)) return;
  S.inv[id]--; S.coins += sellPrice(id); sfx.coin(); save(); render();
}
function sellBelow(minR){
  let gain = 0, n = 0;
  invIds().forEach(id => {
    if(ITEMS[id].r < minR){ gain += sellPrice(id)*S.inv[id]; n += S.inv[id]; S.inv[id] = 0; }
  });
  if(!n){ toast('Нечего продавать'); return; }
  S.coins += gain; sfx.coin(); save(); toast(`Продано ${n} шт: +${fmt(gain)}`); render();
}

// ---------- Апгрейдер ----------
const upChance = (src, tgt) => Math.min(0.85, ITEMS[src].v / ITEMS[tgt].v * 0.93);
function pickUpg(id){ upSel = id; go('upg'); }
function vUpg(){
  const ids = invIds();
  const h = head('upg','Апгрейдер','Рискни предметом ради лучшего');
  if(!ids.length) return h + `<div class="empty">Нечего улучшать. Открой кейс.</div>`;
  if(upSel !== null && !(S.inv[upSel] > 0)) upSel = null;
  let html = h + `<h2 class="t">1. Выбери предмет</h2><div class="grid">` +
    ids.map(id => `<div onclick="pickUpg(${id})" style="cursor:pointer">${card(id,'',id===upSel?'sel':'',S.inv[id])}</div>`).join('') + `</div>`;
  if(upSel !== null){
    const tg = ITEMS.map((it,id)=>({it,id})).filter(o => o.it.v > ITEMS[upSel].v && o.it.v <= ITEMS[upSel].v*25)
      .sort((a,b)=>a.it.v - b.it.v).slice(0,8);
    html += `<h2 class="t" style="margin-top:22px">2. Выбери цель. Предмет сгорит при неудаче</h2>`;
    if(!tg.length) html += `<div class="empty">Выше цели нет.</div>`;
    else html += `<div class="grid">` + tg.map(o => {
      const ch = upChance(upSel, o.id);
      const col = ch > .5 ? 'var(--ok)' : ch > .2 ? 'var(--acc)' : 'var(--bad)';
      return `<div class="tgt" onclick="tryUpgrade(${upSel},${o.id})">${card(o.id, `<div class="chance" style="color:${col}">Шанс ${(ch*100).toFixed(1)}%</div>`)}</div>`;
    }).join('') + `</div>`;
  }
  return html;
}
function tryUpgrade(src, tgt){
  if(busy || !(S.inv[src] > 0)) return;
  ac();
  const ch = upChance(src, tgt), roll = Math.random(), win = roll < ch;
  S.inv[src]--;
  const isNew = win && !S.seen[tgt];
  if(win) giveItem(tgt);
  save(); busy = true;
  openModal(`<h2>Апгрейд</h2>
    <div class="cmp">${card(src)}<div class="arrow">${ico('next')}</div>${card(tgt, isNew ? NEWTAG : '')}</div>
    <div class="bar"><div class="zone" style="width:${ch*100}%"></div><div class="ptr" id="ptr"></div></div>
    <div style="color:var(--dim);font-size:13px">Шанс ${(ch*100).toFixed(1)}%</div>
    <div id="res" style="margin-top:12px;min-height:34px"></div>
    <div class="mbtns" id="mb"></div>`);
  const p = $('ptr');
  const ticks = setInterval(() => sfx.tick(), 90);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    p.style.transition = 'left 2.6s cubic-bezier(.2,.7,.2,1)'; p.style.left = (roll*100) + '%';
  }));
  setTimeout(() => {
    clearInterval(ticks);
    busy = false;
    $('res').innerHTML = win ? `<div class="res-win">Успех! ${ITEMS[tgt].n}</div>` : `<div class="res-lose">${ico('flame')} Предмет сгорел</div>`;
    if(win){
      const col = RAR[ITEMS[tgt].r].c;
      $('mbox').classList.add('glow'); $('mbox').style.setProperty('--gc', col);
      sfx.win(ITEMS[tgt].r); flash(col); FX.burst(innerWidth/2, innerHeight*.4, col, 50, true);
    } else sfx.lose();
    $('mb').innerHTML = `<button class="btn" onclick="closeModal()">Ок</button>`;
    if(!(S.inv[src] > 0)) upSel = null;
  }, 2700);
}

// ---------- Магазин ----------
function vShop(){
  const ac = S.auto
    ? `<span class="acl">Работает: 5 кликов/сек</span>`
    : `<button class="btn" data-cost="${AUTO_COST}" onclick="buyAuto()">Купить ${C(AUTO_COST)}</button>`;
  const hero = `<div class="heroac">
      <div class="ic">${ico('robot')}</div>
      <div class="tx"><b>Автокликер${S.auto?'<span class="tagown">КУПЛЕН</span>':''}</b>
        <p>Сам копает ${AUTO_CPS} раз в секунду с силой твоей кирки. Платишь один раз, дальше он работает сам. Чем сильнее кирка, тем больше приносит.</p></div>
      <div>${ac}</div>
    </div>`;
  const ups = `<div class="ups">` + UPS.map(u => {
    const l = S.up[u.k], maxed = l >= u.max;
    const cost = maxed ? 0 : u.cost(l);
    return `<div class="up"><div class="ic">${ico(u.i)}</div>
      <div class="tx"><b>${u.n}</b><span class="lvl">ур. ${l}/${u.max}</span>
      <p>${maxed ? 'Максимум' : u.d(l)}</p>
      <div class="upbar"><i style="width:${l/u.max*100}%"></i></div></div>
      ${maxed ? `<button class="btn" disabled>MAX</button>`
              : `<button class="btn" data-cost="${cost}" onclick="buyUp('${u.k}')">${C(cost)}</button>`}
    </div>`;
  }).join('') + `</div>`;
  return head('shop','Магазин','Улучшения навсегда') + hero + ups;
}
function buyUp(k){
  const u = UPS.find(x => x.k === k), l = S.up[k];
  if(l >= u.max) return;
  const cost = u.cost(l);
  if(S.coins < cost){ toast('Не хватает монет'); return; }
  S.coins -= cost; S.up[k]++; sfx.coin(); save(); render();
}

// ---------- Коллекция ----------
function vCol(){
  const got = ITEMS.filter((_,id)=>S.seen[id]).length;
  return head('col','Коллекция', `${got} из ${ITEMS.length} найдено`) + `
    <div class="bar2">
      <span>Собрано: <b style="color:var(--g3)">${got}/${ITEMS.length}</b></span>
      <span>Кейсов открыто: <b>${S.opened}</b></span>
      <span>Кликов: <b>${S.clicks}</b></span>
      <span>Лучший: <b>${S.best>=0 ? ITEMS[S.best].n : '—'}</b></span>
    </div>
    <div class="grid">${ITEMS.map((it,id) => S.seen[id] ? card(id) :
      `<div class="item lock"><div class="cube">?</div><div class="nm">???</div><div class="rr" style="color:var(--dim)">${RAR[it.r].n}</div></div>`).join('')}</div>
    <footer><button class="btn red sm" onclick="resetAll()">Сбросить прогресс</button></footer>`;
}
function resetAll(){
  if(!confirm('Стереть весь прогресс?')) return;
  const name = S.name, av = S.av;
  S = DEF(); S.name = name; S.av = av; upSel = null; save(); render();
}

// ---------- Фон ----------
(function(){
  const cv = $('bg'), x = cv.getContext('2d'); let W, H; const P = [];
  function rs(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  rs(); addEventListener('resize', rs);
  for(let i=0;i<70;i++) P.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.8+.4, s:Math.random()*.25+.05, a:Math.random()*6});
  (function loop(){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y -= p.s; if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
      p.a += .012; x.globalAlpha = .25 + .35*Math.abs(Math.sin(p.a));
      x.fillStyle = '#86efac'; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

// ---------- Запуск ----------
wasBoost = boostLeft() > 0;
render();
let acc = 0;
setInterval(() => {
  const m = mult(), a = autoRate(S.up.auto);
  if(a) S.coins += a/10*m;
  if(S.auto){
    acc += AUTO_CPS/10;
    const n = Math.floor(acc);
    if(n){ acc -= n; S.coins += n*clickPower(S.up.click)*m; S.clicks += n; }
  }
  updateHUD(); refreshAfford();
}, 100);
setInterval(() => {
  if(tab === 'top' && !busy && !$('modal').classList.contains('show') && document.activeElement.id !== 'nick') render();
}, 8000);
setInterval(save, 5000);
window.addEventListener('beforeunload', save);
</script>
</body>
